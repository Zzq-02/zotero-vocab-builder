<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>

  <html:div style="display:flex;gap:8px;align-items:center;margin:8px 0;">
    <html:button id="vb-open-note" style="min-width:180px;padding:6px 16px;cursor:pointer;">Open Vocabulary</html:button>
    <html:span id="vb-word-count" style="color:#888;font-size:13px;">0 words</html:span>
  </html:div>

  <hbox align="center" style="margin:4px 0;">
    <html:input type="text" id="vb-quick-input" style="flex:1;min-width:200px;" placeholder="Enter word..." />
    <html:button id="vb-quick-add" style="margin-left:8px;padding:4px 12px;cursor:pointer;">+ Add</html:button>
  </hbox>

  <hbox align="center" style="margin:8px 0;">
    <html:label style="margin-right:8px;">Translate API:</html:label>
    <html:select id="vb-api-select" style="min-width:140px;padding:2px 4px;">
      <html:option value="youdao">YouDao (CN)</html:option>
      <html:option value="dictionary">Free Dictionary (EN)</html:option>
    </html:select>
  </hbox>

  <hbox style="margin:8px 0;">
    <html:button id="vb-sync" style="padding:4px 12px;cursor:pointer;">Sync from Note</html:button>
  </hbox>

</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
